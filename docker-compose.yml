version: '3.8'
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pf_user
      POSTGRES_PASSWORD: pf_pass
      POSTGRES_DB: promptforge
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://pf_user:pf_pass@db:5432/promptforge
      ENCRYPTION_KEY: 32-char-base64-encryption-key-here==
    ports: ["8000:8000"]
    depends_on: [db]
volumes:
  pgdata:
